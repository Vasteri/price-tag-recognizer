name: CI

on:
  pull_request:
    branches: [feature/ci-cd]
  push:
    branches: [feature/ci-cd]

jobs:
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check backend/src
