global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'scrap_metrics_backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  - job_name: 'scrap_metrics_flower'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: /flower/metrics

  - job_name: 'scrap_llama-cpp-server'
    static_configs:
      - targets: ['llama-cpp-server:8000']
    metrics_path: /metrics