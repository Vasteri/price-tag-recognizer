services:
  nginx:
    image: nginx:${NGINX_VERSION}
    ports: 
      - "${NGINX_PORT}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    depends_on:
      - backend

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend/
    volumes:
      - shared_volume:/shared
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  worker:
    build: 
      context: ./recognizer
      dockerfile: Dockerfile
    volumes:
      - shared_volume:/shared
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_MODEL=${LLM_MODEL}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - llama-cpp-server

  llama-cpp-server: # port 8000
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_VERSION}
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m ${MODEL_PATH}
      --mmproj ${MMPROJ_PATH}
      --jinja
      -c ${CONTEXT_SIZE}
      --port 8000
      --host 0.0.0.0
      --n-gpu-layers ${GPU_LAYERS}
      --metrics

  flower:
    image: mher/flower:${FLOWER_VERSION}
    command: celery --broker=redis://redis:6379/0 flower --port=5555 --url_prefix=/flower
    volumes:
      - flower_data:/data
    profiles:
      - monitoring
    depends_on:
      - redis
  
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
        - '--config.file=/etc/prometheus/prometheus.yml'
    profiles:
      - monitoring
    depends_on:
      - flower
      - backend

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Доступ к демону Docker для чтения логов
      - ./infra/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    profiles:
      - monitoring
    depends_on:
      - loki

  loki:
    image: grafana/loki:${LOKI_VERSION} # port 3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes: 
      - loki_data:/loki
    profiles:
      - monitoring
  
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    environment:
      - GF_SERVER_ROOT_URL=/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    profiles:
      - monitoring
    depends_on:
      - prometheus
      - loki
    
volumes:
  shared_volume:
  flower_data:
  prometheus_data:
  loki_data:
  grafana_data:
